[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nila-localai"
version = "0.1.0.dev0"
description = "Privacy-first offline personal AI with optional source-aware web research."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["keyring>=25,<26", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
nila = "nila.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
